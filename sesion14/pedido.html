<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELAH | Pedidos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <a class="marca" href="index.html">
        <img src="img/logo.jpg" alt="Logo SELAH">
        <span>SELAH</span>
    </a>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="producto.html">Productos</a>
        <a class="activo" href="pedido.html">Pedidos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<main class="contenedor">
    <section class="encabezado-pagina">
        <h1>Realiza tu pedido</h1>
        <p>Completa los datos y envíanos tu solicitud por WhatsApp.</p>
    </section>

    <form id="formulario-pedido" class="formulario">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" required>

        <label for="producto">Selecciona tu bolso</label>
        <select id="producto" required>
            <option value="">Selecciona un producto</option>
            <option>Bolso elegante</option>
            <option>Bolso delicado</option>
            <option>Bolso moderno</option>
            <option>Bolso clásico</option>
        </select>

        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" min="1" value="1" required>

        <label for="direccion">Dirección de entrega</label>
        <input type="text" id="direccion" required>

        <label for="mensaje">Detalles adicionales</label>
        <textarea id="mensaje" rows="4"></textarea>

        <button class="boton" type="submit">Enviar pedido por WhatsApp</button>
    </form>
</main>

<footer>
    <p>SELAH - by bijhanyilly</p>
    <p>Gracias por elegirnos.</p>
</footer>

<script>
document.getElementById("formulario-pedido").addEventListener("submit", function(event) {
    event.preventDefault();

    const nombre = document.getElementById("nombre").value;
    const telefono = document.getElementById("telefono").value;
    const producto = document.getElementById("producto").value;
    const cantidad = document.getElementById("cantidad").value;
    const direccion = document.getElementById("direccion").value;
    const mensaje = document.getElementById("mensaje").value;

    const texto = `Hola, quiero realizar un pedido en SELAH.

Nombre: ${nombre}
Teléfono: ${telefono}
Producto: ${producto}
Cantidad: ${cantidad}
Dirección: ${direccion}
Detalles: ${mensaje}`;

    const url = "https://wa.me/573238790612?text=" + encodeURIComponent(texto);
    window.open(url, "_blank");
});
</script>

</body>
</html>
